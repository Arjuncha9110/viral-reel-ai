  <script>
    window.addEventListener('error', function(e) {
      var errDiv = document.createElement('div');
      errDiv.style = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:99999;padding:20px;font-size:18px;white-space:pre-wrap;';
      errDiv.innerText = 'Global Error: ' + (e.error ? e.error.stack : e.message);
      document.body.appendChild(errDiv);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var errDiv = document.createElement('div');
      errDiv.style = 'position:fixed;top:50%;left:0;width:100%;background:orange;color:white;z-index:99999;padding:20px;font-size:18px;white-space:pre-wrap;';
      errDiv.innerText = 'Unhandled Promise Rejection: ' + (e.reason ? (e.reason.stack || e.reason.toString()) : 'Unknown reason');
      document.body.appendChild(errDiv);
    });
  </script>
